<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Chat squircle with shadow -->
  <rect x="10" y="10" width="80" height="74" rx="22" fill="url(#pulseGrad)" filter="url(#pulseGlow)" />
  <!-- Chat tail -->
  <path d="M 26 82 L 15 93 C 13.5 94.5 11 93.5 11 91.2 L 11 80 Z" fill="url(#pulseGrad)" />
  <!-- ECG / Pulse Line -->
  <path d="M 22 48 L 35 48 L 42 28 L 51 68 L 59 38 L 66 52 L 71 48 L 78 48" 
        stroke="url(#waveGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Live Signal Ping Dot -->
  <circle cx="78" cy="48" r="3" fill="#ffffff" />
</svg>
